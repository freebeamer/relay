name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/freebeamer-relay

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to relay host
        # Everything host-specific lives in repository secrets. The deploy key
        # is restricted on the host to deploy/forced-command.sh, which updates
        # the checkout and runs deploy/remote-deploy.sh with this step's
        # payload on stdin.
        env:
          SSH_KEY: ${{ secrets.RELAY_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.RELAY_DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.RELAY_DEPLOY_KNOWN_HOSTS }}
          ADMIN_TOKEN: ${{ secrets.RELAY_ADMIN_TOKEN }}
          DOMAIN: ${{ secrets.RELAY_DOMAIN }}
          CERTBOT_EMAIL: ${{ secrets.RELAY_CERTBOT_EMAIL }}
        run: |
          missing=""
          for name in SSH_KEY DEPLOY_HOST DEPLOY_KNOWN_HOSTS ADMIN_TOKEN DOMAIN CERTBOT_EMAIL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing deploy secrets:$missing (see deploy/README.md)"
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'FREEBEAMER_RELAY_ADMIN_TOKEN=%s\nRELAY_DOMAIN=%s\nRELAY_CERTBOT_EMAIL=%s\n' \
              "$ADMIN_TOKEN" "$DOMAIN" "$CERTBOT_EMAIL" |
            ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "source@$DEPLOY_HOST"
